name: Release Builds

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build App
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux SDK Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Stable Installer
        run: bun run build:stable

      - name: Upload Release Installer
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-${{ matrix.os }}
          path: release/stable/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-installer-*
          path: release-files/
          merge-multiple: true

      - name: Verify release installers
        run: |
          test "$(find release-files/ -maxdepth 1 -type f | wc -l)" -eq 2
          ls -la release-files/

      - name: Generate Release Tag
        id: tag
        run: |
          echo "tag=v0.0.1-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Write commit message as release notes
        run: git log -1 --format=%B "$GITHUB_SHA" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          fail_on_unmatched_files: true
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
